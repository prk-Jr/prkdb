name: Performance Gate

# Deterministic instruction-count gate for phase PRs (spec §6.2). Only meaningful on a
# pull request to main, since it benchmarks base SHA vs. head SHA of the same PR.
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: perf-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # gungraun-runner reads GUNGRAUN_COLOR before falling back to CARGO_TERM_COLOR (see
  # gungraun-runner-0.19.4's src/main.rs) — CARGO_TERM_COLOR=always above is for readable
  # human logs elsewhere in this job, but the bench steps below force gungraun itself
  # into plain output via GUNGRAUN_COLOR=never so parsing never depends on ANSI codes
  # (it no longer scrapes terminal text at all; kept as defense in depth).
  GUNGRAUN_COLOR: never
  # Pin the runner binary to the library version pinned in crates/prkdb/Cargo.toml
  # (Task 1.13: "pin its runner version to the library version"). Bump both together.
  GUNGRAUN_VERSION: "0.19.4"

jobs:
  instruction-count-gate:
    name: Instruction-count regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        # Every piped step (`| tee`, etc.) below needs pipefail or a failing left-hand
        # command is silently swallowed by tee's own zero exit. `bash -eo pipefail` is
        # bash's default under `defaults.run.shell: bash` on GitHub-hosted runners.
        shell: bash
    steps:
      - name: Record job budget origin
        run: python3 -c 'import os,time,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"measurement-job-start").write_text(str(time.monotonic()))'
      # CI preamble (spec conventions): identical to ci.yml's `test` job setup.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Protoc
        run: sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2

      - name: Install Valgrind
        run: sudo apt-get install -y valgrind libclang-dev

      - name: Install gungraun-runner
        run: cargo install gungraun-runner --version "$GUNGRAUN_VERSION" --locked

      - name: Resolve base and head SHAs
        id: shas
        run: |
          echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - name: Test strict measurement and overlay guards
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts -p 'test_perf_measurement_*.py' -v

      - name: Prove coverage and compare identical measurement definitions
        id: head_bench
        timeout-minutes: 35
        env:
          BASE_SHA: ${{ steps.shas.outputs.base }}
          HEAD_SHA: ${{ steps.shas.outputs.head }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PYBUDGET'
          import os,time
          from pathlib import Path
          elapsed = time.monotonic() - float((Path(os.environ['RUNNER_TEMP']) / 'measurement-job-start').read_text())
          assert elapsed <= 240, f'setup exhausted benchmark/upload reserve: {elapsed:.1f}s'
          PYBUDGET
          python3 scripts/perf_measurement_run.py \
            --repo "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --output "$RUNNER_TEMP/perf-measurement"

      - name: Print qualified deltas and coverage status
        if: always()
        run: |
          evidence="$RUNNER_TEMP/perf-measurement"
          echo '## TST-09 same-harness comparison (5% gate unchanged)' >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$evidence/result.json" ]; then
            cat "$evidence/result.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No eligible result: setup or qualification failed.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$evidence/deltas.json" ]; then
            python3 scripts/perf_gate_deltas.py --summary "$evidence/deltas.json" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce the regression gate
        run: |
          code="${{ steps.head_bench.outputs.exit_code }}"

          if [ "$code" = "0" ]; then
            echo "gungraun reported no regression (exit 0)"
            exit 0
          fi

          # code == 3 here; any other value already failed the "Bench head SHA" step
          # unconditionally, above.
          regressed=$(python3 scripts/perf_gate_deltas.py --regressed "$RUNNER_TEMP/perf-measurement/deltas.json")
          echo "regressed benchmarks (gungraun exit 3):"
          echo "$regressed"

          # Override (spec §6.2): a regression is allowed when the PR's diff to the
          # ledger adds or changes a non-empty perf_note. Three-dot diff: compare
          # against the merge base, so unrelated commits already on main between base
          # and head (this is fetch-depth: 0, base may not be head's immediate parent)
          # don't get attributed to this PR's ledger change.
          if git diff "${{ steps.shas.outputs.base }}...${{ steps.shas.outputs.head }}" -- docs/remediation/ledger.toml | grep -qE '^\+perf_note = ".+"'; then
            echo "regression justified by a ledger perf_note"
            exit 0
          fi

          echo "instruction-count regression without a ledger perf_note"
          exit 1

      - name: Retain raw measurements and any failed prefix
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: perf-measurement-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/perf-measurement/commands
            ${{ runner.temp }}/perf-measurement/base
            ${{ runner.temp }}/perf-measurement/head
            ${{ runner.temp }}/perf-measurement/*.json
          if-no-files-found: warn
          retention-days: 30
