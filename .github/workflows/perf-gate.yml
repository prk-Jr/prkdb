name: Performance Gate

# Deterministic instruction-count gate for phase PRs (spec §6.2). Only meaningful on a
# pull request to main, since it benchmarks base SHA vs. head SHA of the same PR.
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: perf-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # gungraun-runner reads GUNGRAUN_COLOR before falling back to CARGO_TERM_COLOR (see
  # gungraun-runner-0.19.4's src/main.rs) — CARGO_TERM_COLOR=always above is for readable
  # human logs elsewhere in this job, but the bench steps below force gungraun itself
  # into plain output via GUNGRAUN_COLOR=never so parsing never depends on ANSI codes
  # (it no longer scrapes terminal text at all; kept as defense in depth).
  GUNGRAUN_COLOR: never
  # Pin the runner binary to the library version pinned in crates/prkdb/Cargo.toml
  # (Task 1.13: "pin its runner version to the library version"). Bump both together.
  GUNGRAUN_VERSION: "0.19.4"

jobs:
  instruction-count-gate:
    name: Instruction-count regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        # Every piped step (`| tee`, etc.) below needs pipefail or a failing left-hand
        # command is silently swallowed by tee's own zero exit. `bash -eo pipefail` is
        # bash's default under `defaults.run.shell: bash` on GitHub-hosted runners.
        shell: bash
    steps:
      # CI preamble (spec conventions): identical to ci.yml's `test` job setup.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
      - uses: actions/checkout@v4
        with:
          # Need both the PR head and its merge base in the same checkout to bench each
          # in turn.
          fetch-depth: 0
      - name: Install Protoc
        run: sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2

      - name: Install Valgrind
        run: sudo apt-get install -y valgrind

      - name: Install gungraun-runner
        run: cargo install gungraun-runner --version "$GUNGRAUN_VERSION" --locked

      - name: Resolve base and head SHAs
        id: shas
        run: |
          echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      # Benchmarked in the same job, on the same runner, so both share whatever noise
      # the runner itself contributes (spec §6.2: "base commit and the PR head are
      # benchmarked in the same job").
      #
      # gungraun has its own native baseline comparison (`--save-baseline` /
      # `--baseline`, verified against gungraun-runner-0.19.4's src/runner/args.rs) —
      # this no longer relies on scraping `cargo bench`'s terminal output, which is
      # unreliable both because gungraun-runner forces colored output from
      # CARGO_TERM_COLOR/GUNGRAUN_COLOR and because the old approach depended on
      # target/ state left over from a prior step rather than an explicit, named
      # baseline.
      #
      # rust-cache (above) may restore a stale target/gungraun/ from a previous run of
      # this workflow on the same cache key; clear it so "base" always means the
      # baseline this job is about to create, not a leftover from an earlier PR push.
      - name: Clear stale gungraun state
        run: rm -rf target/gungraun

      # The very first phase PR to carry this workflow benches a base SHA that predates
      # `iai_hot_paths` entirely (it lands in the same PR as this workflow). Treat a
      # missing bench file at base as "no prior baseline" rather than failing the job:
      # no `--save-baseline=base` step runs, so the head step's `--baseline=base`
      # comparison naturally reports "no comparison" for every benchmark (gungraun
      # creates a new baseline instead of comparing — see --baseline's docs in
      # args.rs). base-benchmarks.txt is left empty in that case, so
      # scripts/perf_gate_deltas.py treats every head benchmark as new (see below)
      # rather than erroring.
      #
      # A benchmark added or renamed in a *later* PR after this file starts existing at
      # base would otherwise still need special-casing — that's what base-benchmarks.txt
      # (captured with `--save-summary=json` here too, then `list-names`) is for: it
      # records which benchmark ids existed at base by name, so the deltas step can tell
      # "new benchmark, no comparison possible" apart from "existing benchmark, base
      # comparison unexpectedly missing" (see scripts/perf_gate_deltas.py's docstring).
      # This must run and be captured to a *separate* file before the head step below,
      # because both base and head write to the same `summary.json` path per benchmark
      # (SummaryOutput::init in gungraun's source) — the head run overwrites base's
      # summaries in place.
      #
      # NOTE: a benchmark that's already broken on main (e.g. panics, or was removed
      # from main mid-flight) makes *every* PR's base step fail here, including the PR
      # that would fix it — the base step benches main's tree, not the PR's. If that
      # happens, the fix has to land on main first (or this workflow needs a manual
      # override), since this job can't tell "broken because of this PR" apart from
      # "broken already, on main".
      - name: Bench base SHA
        id: base_bench
        run: |
          git checkout "${{ steps.shas.outputs.base }}"
          if [ -f crates/prkdb/benches/iai_hot_paths.rs ]; then
            cargo bench -p prkdb --bench iai_hot_paths -- \
              --save-baseline=base --save-summary=json
            python3 scripts/perf_gate_deltas.py list-names target/gungraun \
              > base-benchmarks.txt
            # `SummaryOutput::init` (gungraun-runner-0.19.4) only overwrites the
            # summary.json of a benchmark that runs again at head with the same name —
            # a benchmark renamed or removed at head (as Task 2.3 did for the WAL
            # benches) leaves its base-run summary.json sitting under its old name.
            # `extract` then sees that old name as Left-only ("bootstrap") with no
            # comparison, and since it's also in base-benchmarks.txt (this file, just
            # written) it's flagged "existed at base, no base comparison" and fails the
            # gate for a rename that isn't a regression. The *baselines* gungraun's own
            # `--baseline=base` comparison reads are separate `*.out.base@base` files,
            # untouched by this — only the redundant summary.json copies need deleting.
            find target/gungraun -name summary.json -delete
            echo "benched=true" >> "$GITHUB_OUTPUT"
          else
            echo "iai_hot_paths does not exist at base SHA; no prior baseline to compare against"
            : > base-benchmarks.txt
            echo "benched=false" >> "$GITHUB_OUTPUT"
          fi

      # `--callgrind-limits='ir=5%'` sets a 5% soft regression limit on the
      # Instructions (Ir) metric (format verified against args.rs's
      # `parse_callgrind_limits`/`--callgrind-limits` docs, which give exactly this
      # `ir=5%` form as an example). `--save-summary=json` writes gungraun's own
      # machine-readable summary (schema documented in scripts/perf_gate_deltas.py)
      # instead of us parsing text. Per gungraun's documented exit codes (args.rs's
      # `after_help`): 0 = success, 1 = any other error (compile failure, panic,
      # ...), 2 = arg parsing failure, 3 = a performance regression was detected. Only
      # exit 3 is eligible for the ledger perf_note override below — 1 and 2 fail the
      # job unconditionally, with no override, since they mean the benchmark itself
      # didn't run cleanly rather than "it ran and got slower."
      - name: Bench head SHA
        id: head_bench
        run: |
          git checkout "${{ steps.shas.outputs.head }}"
          set +e
          cargo bench -p prkdb --bench iai_hot_paths -- \
            --baseline=base --callgrind-limits='ir=5%' --save-summary=json
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            echo "gungraun exited $code (not a regression verdict) — failing unconditionally"
            exit "$code"
          fi

      # TST-09: a benchmark whose Ir falls below its floor measured nothing, whatever its
      # delta says — no perf_note override, unlike the regression gate below, because a
      # vacuous measurement isn't a regression that can be justified. Runs against the
      # head SHA's own summaries (already written above by "Bench head SHA").
      - name: Enforce the instruction-count floors
        run: |
          {
            echo "## Instruction-count floors (TST-09)"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/perf_gate_deltas.py floors target/gungraun \
            scripts/perf_gate_floors.toml >> "$GITHUB_STEP_SUMMARY"

      # `if: steps.head_bench.outcome == 'success'` (not the step-less default): a
      # floors failure above must not hide the deltas table below it (this step has no
      # `if:` otherwise skips once any prior step fails) — but a real "Bench head SHA"
      # failure (exit code outside {0, 3}, which that step already turns into a hard
      # `exit "$code"`) means there is no usable target/gungraun to extract from, and
      # should still skip everything after it, same as before this step gained an `if:`.
      - name: Compute instruction-count deltas
        if: ${{ !cancelled() && steps.head_bench.outcome == 'success' }}
        run: |
          python3 scripts/perf_gate_deltas.py extract target/gungraun \
            --base-list base-benchmarks.txt > deltas.json

      - name: Print deltas to job summary
        if: always()
        run: |
          echo "## Instruction-count deltas (base -> head)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f deltas.json ]; then
            echo "no deltas.json (the deltas step itself failed before writing one)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/perf_gate_deltas.py --summary deltas.json >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce the regression gate
        run: |
          code="${{ steps.head_bench.outputs.exit_code }}"

          if [ "$code" = "0" ]; then
            echo "gungraun reported no regression (exit 0)"
            exit 0
          fi

          # code == 3 here; any other value already failed the "Bench head SHA" step
          # unconditionally, above.
          regressed=$(python3 scripts/perf_gate_deltas.py --regressed deltas.json)
          echo "regressed benchmarks (gungraun exit 3):"
          echo "$regressed"

          # Override (spec §6.2): a regression is allowed when the PR's diff to the
          # ledger adds or changes a non-empty perf_note. Three-dot diff: compare
          # against the merge base, so unrelated commits already on main between base
          # and head (this is fetch-depth: 0, base may not be head's immediate parent)
          # don't get attributed to this PR's ledger change.
          if git diff "${{ steps.shas.outputs.base }}...${{ steps.shas.outputs.head }}" -- docs/remediation/ledger.toml | grep -qE '^\+perf_note = ".+"'; then
            echo "regression justified by a ledger perf_note"
            exit 0
          fi

          echo "instruction-count regression without a ledger perf_note"
          exit 1
