      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --profile ci
      - run: cargo test --doc --workspace
        if: ${{ !cancelled() }}

  harness:
    name: Crash/Restart Harness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # A cold cache builds the debug/dev profile of prkdb for the harness binary (not a
    # separate release profile — `cargo xtask verify` builds debug by default).
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
      - uses: actions/checkout@v4
      - name: Install Protoc
        run: sudo apt-get install -y protobuf-compiler
      # Honour rust-toolchain.toml. `@stable` overrides it, so CI was building with a
      # newer compiler than the repository declares — and failing on lints no
      # contributor could reproduce locally. `nightly-check` keeps the forward-looking
      # signal, on purpose and out of the gating path.
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      # 200 seeds measured at ~5s warm locally; well inside the 30-minute budget even
      # accounting for a cold cache building the debug profile from scratch.
      - run: cargo xtask verify --profile blocking --seeds 200 --mode durable

