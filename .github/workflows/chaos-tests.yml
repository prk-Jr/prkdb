name: Chaos Tests

on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # RAFT CHAOS ENGINEERING TESTS
  # Features:
  #   - 5-node cluster under continuous load
  #   - Random node kills/restarts during operation
  #   - Data integrity verification after chaos
  # ═══════════════════════════════════════════════════════════════════════════
  raft-chaos-tests:
    name: "🐵 Raft Chaos Engineering"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - uses: actions/checkout@v7

      - name: Install Protoc
        run: sudo apt-get install -y protobuf-compiler

      # Pinned, not @stable: @stable overrides rust-toolchain.toml, so these jobs built
      # with a different compiler than the repository declares. ci.yml was pinned for that
      # reason; this workflow was missed.
      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2

      # Every test in raft_chaos_tests builds a TestCluster, which spawns this binary
      # as a child process and panics with "Binary not found" without it. The workflow
      # never built it, which is the likeliest reason the step below was marked
      # continue-on-error: the failure was structural, not a real chaos finding.
      - name: Build server binary (required by TestCluster)
        run: cargo build --bin prkdb-server --features chaos

      - name: Run Chaos Monkey Test
        run: |
          echo "🐵 Starting Chaos Monkey Test..."
          cargo test --features chaos --test raft_chaos_tests test_chaos_monkey_continuous_load -- --ignored --nocapture
        env:
          RUST_LOG: info
          RUST_BACKTRACE: 1
        timeout-minutes: 20

      # No continue-on-error. A chaos suite whose result is discarded is not a chaos
      # suite; the README badge claimed "19 passing" while this step swallowed every
      # failure. If these are too unstable to gate, mark the specific test
      # #[ignore = "reason"] so the discipline check keeps it visible.
      - name: Run All Raft Chaos Tests
        run: cargo test --features chaos --test raft_chaos_tests -- --ignored --nocapture
        timeout-minutes: 20

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: raft-chaos-logs
          path: |
            /tmp/prkdb_test_logs/
            /tmp/chaos-*.log
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up test artifacts..."
          rm -rf /tmp/prkdb_test_logs/ || true
          rm -rf /tmp/chaos-*.log || true
          pkill -f prkdb-server || true

  # ═══════════════════════════════════════════════════════════════════════════
  # JEPSEN-STYLE CONSISTENCY TESTS
  # Features:
  #   - Linearizable register verification
  #   - Bank transfer invariant checks
  #   - Monotonic reads validation
  # ═══════════════════════════════════════════════════════════════════════════
  consistency-tests:
    name: "📊 Consistency Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Protoc
        run: sudo apt-get install -y protobuf-compiler

      # Pinned, not @stable: @stable overrides rust-toolchain.toml, so these jobs built
      # with a different compiler than the repository declares. ci.yml was pinned for that
      # reason; this workflow was missed.
      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2

      # `--features chaos` on every step below: partitioning is injected through the fault
      # injector, which is compiled only under that feature. Without it the partition
      # tests are #[cfg]'d out entirely rather than silently partitioning nothing — so
      # they must be run somewhere that enables it, or they never run at all.
      #
      # That rule was written here before, and the two steps that used to sit above it did
      # not follow it. `jepsen_consistency_tests` ran without the feature, so
      # `a_replicated_register_is_linearizable_across_a_partition` — R1 acceptance #2, and
      # the workload that found S-06 — had never executed. `peer_authz` was named by no
      # step at all, so neither had R12 acceptance #16.
      #
      # `scripts/check_chaos_tests_run.sh` now enforces this instead of describing it.
      #
      # They use the in-process cluster harness, so no prebuilt binary is required.
      - name: Run Jepsen Consistency Tests
        run: cargo test --features chaos --test jepsen_consistency_tests -- --nocapture

      - name: Run Extended Chaos Tests
        run: cargo test --features chaos --test extended_chaos_tests -- --nocapture

      - name: Run Peer Authorization Tests
        run: cargo test --features chaos --test peer_authz -- --nocapture

      - name: Run Election Safety Tests
        run: cargo test --features chaos --test election_safety -- --nocapture

      - name: Run Read Consistency Mode Tests
        run: cargo test --features chaos --test read_consistency_modes -- --nocapture

      - name: Run In-Process Cluster Harness Tests
        run: cargo test --features chaos --test in_process_cluster -- --nocapture

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/test-* || true

  # ═══════════════════════════════════════════════════════════════════════════
  # RESULTS SUMMARY
  # ═══════════════════════════════════════════════════════════════════════════
  notify-results:
    name: "📋 Results Summary"
    runs-on: ubuntu-latest
    needs: [raft-chaos-tests, consistency-tests]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## 🐵 Chaos Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Raft Chaos | ${{ needs.raft-chaos-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Consistency + Extended Chaos | ${{ needs.consistency-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Counts are deliberately not stated here. The previous version claimed" >> $GITHUB_STEP_SUMMARY
          echo "\"7 / 6 / 6, total 19\" against actual suites of 14 / 13 / 13 — the same" >> $GITHUB_STEP_SUMMARY
          echo "drift as the README badge that advertised \"19 passing\" while the step" >> $GITHUB_STEP_SUMMARY
          echo "producing it discarded failures. Read the job logs for real numbers." >> $GITHUB_STEP_SUMMARY
