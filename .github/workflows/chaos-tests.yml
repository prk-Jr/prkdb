name: Chaos Tests

on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # RAFT CHAOS ENGINEERING TESTS
  # Features:
  #   - 5-node cluster under continuous load
  #   - Random node kills/restarts during operation
  #   - Data integrity verification after chaos
  # ═══════════════════════════════════════════════════════════════════════════
  raft-chaos-tests:
    name: "🐵 Raft Chaos Engineering"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - uses: actions/checkout@v4

      - name: Install Protoc
        run: sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Every test in raft_chaos_tests builds a TestCluster, which spawns this binary
      # as a child process and panics with "Binary not found" without it. The workflow
      # never built it, which is the likeliest reason the step below was marked
      # continue-on-error: the failure was structural, not a real chaos finding.
      - name: Build server binary (required by TestCluster)
        run: cargo build --bin prkdb-server --features chaos

      - name: Run Chaos Monkey Test
        run: |
          echo "🐵 Starting Chaos Monkey Test..."
          cargo test --features chaos --test raft_chaos_tests test_chaos_monkey_continuous_load -- --ignored --nocapture
        env:
          RUST_LOG: info
          RUST_BACKTRACE: 1
        timeout-minutes: 20

      # No continue-on-error. A chaos suite whose result is discarded is not a chaos
      # suite; the README badge claimed "19 passing" while this step swallowed every
      # failure. If these are too unstable to gate, mark the specific test
      # #[ignore = "reason"] so the discipline check keeps it visible.
      - name: Run All Raft Chaos Tests
        run: cargo test --features chaos --test raft_chaos_tests -- --ignored --nocapture
        timeout-minutes: 20

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raft-chaos-logs
          path: |
            /tmp/prkdb_test_logs/
            /tmp/chaos-*.log
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up test artifacts..."
          rm -rf /tmp/prkdb_test_logs/ || true
          rm -rf /tmp/chaos-*.log || true
          pkill -f prkdb-server || true

  # ═══════════════════════════════════════════════════════════════════════════
  # JEPSEN-STYLE CONSISTENCY TESTS
  # Features:
  #   - Linearizable register verification
  #   - Bank transfer invariant checks
  #   - Monotonic reads validation
  # ═══════════════════════════════════════════════════════════════════════════
  consistency-tests:
    name: "📊 Consistency Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Protoc
        run: sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run Jepsen Consistency Tests
        run: cargo test --test jepsen_consistency_tests -- --nocapture

      - name: Run Extended Chaos Tests
        run: cargo test --test extended_chaos_tests -- --nocapture

      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/test-* || true

  # ═══════════════════════════════════════════════════════════════════════════
  # RESULTS SUMMARY
  # ═══════════════════════════════════════════════════════════════════════════
  notify-results:
    name: "📋 Results Summary"
    runs-on: ubuntu-latest
    needs: [raft-chaos-tests, consistency-tests]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## 🐵 Chaos Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Raft Chaos | ${{ needs.raft-chaos-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Consistency + Extended Chaos | ${{ needs.consistency-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Counts are deliberately not stated here. The previous version claimed" >> $GITHUB_STEP_SUMMARY
          echo "\"7 / 6 / 6, total 19\" against actual suites of 14 / 13 / 13 — the same" >> $GITHUB_STEP_SUMMARY
          echo "drift as the README badge that advertised \"19 passing\" while the step" >> $GITHUB_STEP_SUMMARY
          echo "producing it discarded failures. Read the job logs for real numbers." >> $GITHUB_STEP_SUMMARY
