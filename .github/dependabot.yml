version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      # Patch and minor bumps arrive as one PR per week rather than one per crate;
      # 481 lockfile entries would otherwise bury everything else.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # Grouped and capped for the same reason as cargo: each open PR runs the full ~21-job
    # CI matrix, and 14 of them at once starved main's own verification run of runners.
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # `dtolnay/rust-toolchain@1.95.0` is not an action release. The ref *is* the Rust
      # toolchain to install, so Dependabot reading it as a version and bumping it invents
      # a Rust release that does not exist: it proposed 1.100.0 across nineteen call sites
      # and every job failed with "could not download nonexistent rust version 1.100.0",
      # 404 from static.rust-lang.org.
      #
      # Even a real release would be wrong from here. The toolchain is pinned in
      # rust-toolchain.toml, which asks that `channel` stay in sync with `rust-version` in
      # the workspace Cargo.toml — three places that move together, deliberately, and not
      # by a bot bumping one of them.
      - dependency-name: "dtolnay/rust-toolchain"
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      docs-toolchain:
        patterns:
          - "*"
    commit-message:
      prefix: "docs"
