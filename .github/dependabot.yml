version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      # Patch and minor bumps arrive as one PR per week rather than one per crate;
      # 481 lockfile entries would otherwise bury everything else.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: monthly
    commit-message:
      prefix: "docs"
