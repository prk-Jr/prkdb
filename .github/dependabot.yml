version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      # Patch and minor bumps arrive as one PR per week rather than one per crate;
      # 481 lockfile entries would otherwise bury everything else.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # Grouped and capped for the same reason as cargo: each open PR runs the full ~21-job
    # CI matrix, and 14 of them at once starved main's own verification run of runners.
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      docs-toolchain:
        patterns:
          - "*"
    commit-message:
      prefix: "docs"
