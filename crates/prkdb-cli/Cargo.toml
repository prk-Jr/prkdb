[package]
name = "prkdb-cli"
version = "0.6.0"
edition = "2021"
description = "Command-line interface for PrkDB management and monitoring"
authors = ["PrkDB Team"]
license = "Apache-2.0"

[[bin]]
name = "prkdb-cli"
path = "src/main.rs"


[dependencies]
prkdb = { path = "../prkdb" }
prkdb-types = { path = "../prkdb-types" }
prkdb-core = { path = "../prkdb-core" }
prkdb-client = { path = "../prkdb-client" }
prkdb-storage-sled = { path = "../prkdb-storage-sled" }

# CLI framework
clap = { workspace = true, features = ["derive", "color", "env"] }
tokio = { workspace = true }

# HTTP server (for serve command)
axum = { workspace = true, features = ["ws", "json"] }
axum-server = { workspace = true }
# Pinned to the same backend as the workspace so `install_default()` below has exactly one
# provider to choose. See the panic it prevents in serve.rs.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
futures-util = "0.3"
tonic = { workspace = true, features = ["transport"] }

# Output formatting
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tabled = "0.15"
colored = "2.0"
bincode = { workspace = true }

# Utilities
anyhow = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
humantime = "2.1"
# Backup archive manifests. Already in the tree transitively; declared directly so the
# verification path does not depend on another crate keeping it.
sha2 = "0.10"
# Constant-time credential comparison.
subtle = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
prost.workspace = true
prost-types.workspace = true
reqwest = { workspace = true }

[dev-dependencies]
prkdb-proto = { path = "../prkdb-proto" }
rand = "0.8"
tempfile = "3.8"
# Test certificates for the HTTPS listener test.
#
# default-features = false is load-bearing: rcgen's default backend is `ring`, and the
# workspace's rustls already uses `aws-lc-rs`. Enabling both makes rustls unable to pick a
# process-level CryptoProvider, and every TLS test panics at runtime with
# "Could not automatically determine the process-level CryptoProvider".
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
