# cargo-mutants configuration.
#
# Two things may be excluded, and nothing else:
#
#   1. Equivalent mutants — they change no behaviour for any input, so no test can
#      distinguish them.
#   2. Mutants not reachable through the crate's public surface, where the entry names
#      the specific capability that is missing and would remove it.
#
# Category 2 is currently **empty**, and that is the point of naming the missing capability
# rather than writing "hard to test". Its one entry was
# `CollectionPartitionedAdapter::flush`, which said it needed a fault-injecting inner
# adapter; that adapter now exists as `wal_adapter::fault_injection`, the test it called
# for is written, and the entry is gone. An exemption that states its own exit condition
# is a to-do item. One that does not is permanent.
#
# "Hard to test" is not a reason. A survivor that changes observable behaviour is a
# missing test, and the fix is the test — that is how the other 36 survivors from run
# 31358158012 were handled, including a cluster-secret bypass that authenticated any
# string of the right length.
#
# The same discipline as `scripts/check_ignore_reasons.sh` and the `EXEMPT` map in
# `scripts/check_wrapper_completeness.sh`.
exclude_re = [
    # `required_permission` classifies FetchSegment as Admin with an explicit arm, and its
    # fallback arm is *also* Admin. Deleting the explicit arm therefore changes no
    # behaviour for any input, so no test can distinguish it — an equivalent mutant.
    #
    # The arm stays despite being redundant today. It is what keeps FetchSegment at Admin
    # if the fallback is ever loosened, and FetchSegment streams raw WAL across every
    # collection — the exact hole spec S-01 was filed for. Deleting it to satisfy the
    # mutation report would trade a real safety property for a clean number.
    #
    # Found by run 31358158012, shard 3, alongside a genuine gap in the same function
    # (nothing asserted that a Write grant admits writes) which was fixed with a test
    # rather than an exclusion.
    'delete match arm "FetchSegment" in required_permission',

    # Category 1. `get_many`'s small-batch path looks a key's offset up in the index and
    # reads exactly that record, so `LogOperation::Put { id, .. } if id == key_clone` is a
    # consistency check on a record that is already the right one. Forcing the guard `true`
    # therefore changes nothing.
    #
    # Distinguished from a real gap by testing both directions: forcing it `false` IS
    # killed (`get_many_returns_the_right_value_per_key` and
    # `get_many_reads_from_the_wal_when_the_cache_is_cold` both fail), because the match
    # then falls past the `Put` arm and the read returns nothing. A guard that matters in
    # one direction only is redundant, not untested.
    #
    # Run 31411280726.
    'replace match guard id == key_clone with true in <impl StorageAdapter for WalStorageAdapter>::get_many',

    # Category 1. The `miss_keys.len() > 100` threshold selects between a single scan and
    # per-key index lookups. Both return the same answers — it is a performance choice, and
    # `a_large_cold_batch_read_returns_the_right_values` asserts the values agree on both
    # sides of the boundary. Mutating the comparison changes which strategy runs, not what
    # it returns.
    #
    # Run 31411280726.
    'replace > with (==|<|>=) in <impl StorageAdapter for WalStorageAdapter>::get_many',

    # Category 1. `outbox_list`'s body is `Ok(Vec::new())`, so replacing it with
    # `Ok(vec![])` substitutes the expression for itself. Nothing distinguishes them,
    # including `the_outbox_stub_reports_nothing_rather_than_something`, which asserts the
    # list is empty and so kills every *populated* replacement of this function while
    # necessarily passing for this one.
    #
    # Anchored on the empty-vector variant on purpose: the six mutants returning invented
    # entries are not equivalent and stay in scope, because a caller draining the outbox
    # would act on rows that were never saved.
    #
    # Run 31362753534, shard 7.
    'outbox_list .* with Ok\(vec!\[\]\)$',

    # NEITHER category. This is a tracked to-do with a stated exit condition, and it is the
    # only entry here that is not equivalent or unreachable. It is written out rather than
    # dressed up as one of the two, because the difference is the whole point of this file.
    #
    # The mutant is CAUGHT. The tests notice it — they notice it by hanging, because
    # deleting this function means queued writes are never published and every caller
    # awaiting a oneshot blocks forever. cargo-mutants classifies that as TIMEOUT rather
    # than caught, and the job fails on a full 300s budget spent per run.
    #
    # The hang is not a testing artifact. It is the symptom a user would get, and it comes
    # from a real defect: every queued write is a promise to the caller, and nothing in the
    # system is responsible for keeping it. run_writer_loop is spawned fire-and-forget
    # through a Weak with no JoinHandle retained, and the `oneshot canceled` handler at the
    # await sites is dead code — RecvError fires on sender *drop*, and no path guarantees a
    # queued PendingWrite is ever dropped or fired.
    #
    # No test can remove this entry. The violated property is liveness — "the write is
    # eventually published" — and there is no non-temporal observation of *never*. A test
    # can only ever observe "not yet". The fix is structural: supervise the writer, account
    # for progress, and give the client bound an honest not-confirmed error.
    #
    # EXIT CONDITION: acceptance criterion 5 of
    # docs/superpowers/specs/2026-08-11-wal-writer-liveness.md — the mutant reports CAUGHT
    # within one watchdog interval instead of TIMEOUT. Delete this entry then.
    #
    # Run 31505589348, mutants-diff on PR #53.
    'replace WalStorageAdapter::flush_accumulator_inner with \(\)',

]
