# Generated by scripts/capture_baseline.sh on 2026-09-24
#
# Phase 1 performance baseline (spec §6.1). This is a REFERENCE, NOT A TARGET:
# today's write numbers are inflated because the WAL acknowledges writes after a
# memcpy into mmap with no fsync (STO-02). Phase 2 records a durable baseline
# (docs/benchmarks/baseline-format-v2.toml) and later phases compare against that.
#
# Values are Criterion ns/iter (`--output-format bencher`), captured with shortened
# windows (--warm-up-time 1 --measurement-time 2) to fit the run in ~30 minutes.
# Wall-clock numbers on a shared laptop are noisy; the gating signal for phase PRs is
# the instruction-count gate (.github/workflows/perf-gate.yml), not these values.
#
# Conditions:
# - Tree: remediation/phase-1 @ 3fdd08b plus the bench sources committed with this file.
# - 1-minute load average: ~1.9-2.1 when capture started, rising to ~4-5 during the
#   run from unrelated activity on the machine.
# - recovery_bench: default RECOVERY_BENCH_BYTES = 1 GiB of 1 KiB values,
#   WalConfig::benchmark_config(), 10 samples. This exercises recovery with the WAL
#   file already warm in the OS page cache (it was just written by the same process
#   a moment before recovery runs) — a cold-cache recovery number is not captured
#   here.
# - cluster_write_bench: 3-node in-process cluster (tests/helpers/in_process_cluster.rs).
# - storage_bench: single_put/batch_put_100 re-captured 2026-09-24 after fixing a bug
#   where adapter creation was inside the timed region (see the [storage_bench] table
#   below for the full explanation); the other four bench files still reflect the
#   original 3fdd08b capture.
#
# Deferred to the Phase 2 durable baseline (docs/benchmarks/baseline-format-v2.toml),
# not captured here:
# - p50/p99 latency rows (spec §6.1 asks for these): Criterion's `--output-format
#   bencher` reports a single ns/iter point estimate (mean of the timed samples), not
#   a percentile distribution. Getting p50/p99 would need Criterion's own HTML/JSON
#   report format (or a custom histogram), which is out of scope for this reference
#   capture.
# - 64 KiB value size rows (spec §6.1 lists value sizes beyond the 1 KiB used
#   throughout this file): not swept here: this baseline exists to catch phase-to-phase
#   regressions relative to itself, not to characterize value-size scaling.
