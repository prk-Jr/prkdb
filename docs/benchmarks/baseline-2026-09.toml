# Re-captured 2026-09-24: storage_put/single_put and storage_batch/batch_put_100
# previously created and tore down a fresh WalStorageAdapter (tempdir + WAL init)
# inside the timed region on every iteration, so those two rows measured adapter
# lifecycle cost, not put cost. Fixed in crates/prkdb/benches/storage_bench.rs (adapter
# built once, outside `b.iter`/`iter_batched`'s timed closure, matching the pattern
# already used by storage_get/storage_mixed/storage_cache below). single_put dropped
# ~8x (1181420 -> 146671) now that it isn't paying for adapter setup. batch_put_100 rose
# (1203207 -> 1842204): the old number was dominated by the same one-time adapter setup
# masking the real cost of 100 real WAL puts, which is genuinely more expensive than
