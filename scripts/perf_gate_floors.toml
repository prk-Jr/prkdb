# Minimum plausible instruction counts for the perf gate (TST-09). A benchmark whose Ir
# falls below `min_ratio * Ir(reference)` measured nothing and fails the gate, whatever
# its delta says. Reference benchmarks are pure single-threaded CPU work: since Task 2.8d,
# `Batch::encode`/`Batch::decode` of one 1 KiB put (the single WAL's frame payload codec),
# replacing the old `LogRecord` encode/decode.
[floors.bench_wal_put_100]
reference = "bench_batch_encode"
min_ratio = 100.0   # 100 puts must at least encode 100 batches

[floors.bench_wal_get_one]
reference = "bench_batch_decode"
# The fixture evicts the key from cache before the measured get (see
# setup_wal_get_one's doc comment in iai_hot_paths.rs), so this is an index lookup plus
# a real WAL read (frame CRC) and a batch decode, not a cache hit. Set at 3.0 against
# the old LogRecord decode reference (7351 Ir vs 1385 Ir, a 5.3x ratio, probe
# https://github.com/prk-Jr/prkdb/actions/runs/36074847032), with headroom for jitter
# while still rejecting the old cache-hit version of this benchmark (a 1.4x ratio).
# Re-checked against bench_batch_decode by the Task 2.8d probe=iai run.
min_ratio = 3.0

[floors.bench_wal_batch_of_100]
reference = "bench_batch_encode"
min_ratio = 50.0

[floors.bench_indexed_insert_one]
reference = "bench_batch_encode"
min_ratio = 1.0

# The stored key of one typed record (KEY-01, review M1): a header plus a memcomparable id
# in one allocation, a few hundred Ir at most against the reference's ~5.9 K. The floor
# only rejects a benchmark that counted nothing; a regression shows in the delta.
[floors.bench_encode_record_key_u64]
reference = "bench_batch_encode"
min_ratio = 0.005

[floors.bench_encode_record_key_string]
reference = "bench_batch_encode"
min_ratio = 0.005

[floors.bench_encode_record_key_uuid]
reference = "bench_batch_encode"
min_ratio = 0.005
