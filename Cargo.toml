[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/prkdb",
    "crates/prkdb-cli",
    "crates/prkdb-client",
    "crates/prkdb-core",
    "crates/prkdb-macros",
    "crates/prkdb-metrics",
    "crates/prkdb-orm",
    "crates/prkdb-orm-macros",
    "crates/prkdb-proto",
    "crates/prkdb-schema",
    "crates/prkdb-storage-sled",
    "crates/prkdb-storage-sql",
    "crates/prkdb-storage-segmented",
    "crates/prkdb-types",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
# Keep in sync with rust-toolchain.toml. The previous README claim of "Rust 1.70+"
# was never verified or enforced by anything.
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/prk-Jr/prkdb"
authors = ["prk-Jr"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1.88"
bincode = { version = "2.0.1", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde", "alloc"] }
tracing = "0.1"
tracing-subscriber = "0.3"
criterion = { version = "0.5", features = ["async_tokio"] }
rstest = "0.26"
axum-server = { version = "0.8", features = ["tls-rustls"] }
# Hoisted so the workspace resolves one HTTP stack. prkdb was on 0.12 and prkdb-cli on
# 0.11, which meant two TLS configurations and two CVE surfaces for the same job; deny.toml
# documented the deferral and kept `multiple-versions = "warn"`, which is the "suppress
# rather than fix" outcome R10 said not to take. `blocking` is enabled here because the
# CLI's integration tests use it.
reqwest = { version = "0.12", features = ["json", "blocking"] }
subtle = "2.6"
dashmap = "5.5"
uuid = { version = "1.11", features = ["v4"] }
prometheus = "0.14"
axum = "0.7.9"
lazy_static = "1.5"
crossbeam = "0.8"
mimalloc = { version = "0.1", default-features = false }
lz4 = "1.24"
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"
clap = { version = "4.5", features = ["derive", "color", "env"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
flate2 = "1.0"
tar = "0.4"

prkdb-types = { path = "crates/prkdb-types" }
prkdb-proto = { path = "crates/prkdb-proto" }
prkdb-client = { path = "crates/prkdb-client" }
prkdb = { path = "crates/prkdb" }
prkdb-core = { path = "crates/prkdb-core" }
prkdb-macros = { path = "crates/prkdb-macros" }
prkdb-metrics = { path = "crates/prkdb-metrics" }
prkdb-orm-macros = { path = "crates/prkdb-orm-macros" }
prkdb-orm = { path = "crates/prkdb-orm" }
prkdb-storage-sled = { path = "crates/prkdb-storage-sled" }
prkdb-storage-sql = { path = "crates/prkdb-storage-sql" }
prkdb-storage-segmented = { path = "crates/prkdb-storage-segmented" }
prkdb-schema = { path = "crates/prkdb-schema" }

# Optimize for CI to avoid Linker OOM (Bus Error signal 7)
# Reduces debug info for dependencies in dev/test builds
[profile.dev.package."*"]
debug = 0

[profile.test.package."*"]
debug = 0
